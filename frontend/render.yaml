services:
  - type: web
    name: algotrader-api
    runtime: python
    repo: https://github.com/YOUR_USERNAME/algotrader
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: algotrader-db
          property: connectionString
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

databases:
  - name: algotrader-db
    plan: free
